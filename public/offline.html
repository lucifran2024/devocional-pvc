<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Devocional PVC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            text-align: center;
            max-width: 420px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            color: #f59e0b;
            margin-bottom: 12px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .hint {
            font-size: 14px;
            color: #64748b;
            border-top: 1px solid #1e293b;
            padding-top: 20px;
            margin-top: 8px;
        }
        a {
            display: inline-block;
            background: #f59e0b;
            color: #0f172a;
            padding: 12px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 24px;
        }
        a:hover { background: #d97706; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📖</div>
        <h1>Sem conexao</h1>
        <p>Voce esta offline, mas se ja baixou a Biblia, ela esta disponivel.</p>
        <a href="/biblioteca">Abrir Biblia Offline</a>
        <p class="hint">
            Quando voltar a ter internet, o app carregara normalmente.
            Para baixar a Biblia offline, acesse Biblioteca &gt; Gerenciar Offline.
        </p>
    </div>
</body>
</html>
