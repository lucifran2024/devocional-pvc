name: Deploy Edge Function (Execute)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/execute/**"
      - ".github/workflows/deploy-edge-only.yml"

jobs:
  deploy-edge:
    name: Deploy Execute Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Execute Edge Function
        run: supabase functions deploy execute --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
