name: Deploy Edge Function (Execute)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/execute/**"
      - "supabase/functions/transcrever-social/**"
      - ".github/workflows/deploy-edge-only.yml"

jobs:
  deploy-edge:
    name: Deploy Execute Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0

      - name: Deploy Execute Edge Function
        run: supabase functions deploy execute --project-ref tayopwdelkmelgmrtnoa --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Social Transcription Edge Function
        run: supabase functions deploy transcrever-social --project-ref tayopwdelkmelgmrtnoa
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
